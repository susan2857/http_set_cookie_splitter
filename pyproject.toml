[project]
name = "http-set-cookie-splitter"
version = "0.1.0"
description = "Parses multiple Set-Cookie headers from a raw response, separating name-value pairs from attributes like Path, Domain, SameSite, and HttpOnly."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
